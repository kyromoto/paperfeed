services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The app itself. Disabled by default (docker compose --profile app up), in development it usually runs on the
  # host (pnpm run dev) and ngrok forwards to it.
  paperfeed:
    image: ghcr.io/kyromoto/paperfeed:latest
    profiles: ["app"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      CONFIG_PATH: /config/config.yml
      SERVER_DATA_PATH: /data
      SERVER_QUEUE_REDIS_URL: redis://redis:6379
      SERVER_DRIVE_MONITOR_WEBHOOK_URL: https://your-public-url.example.com
      # SERVER_HTTP_PORT: 3000
    volumes:
      - ./config/config.yml:/config/config.yml:ro
      - ./data:/data

  bull-board:
    image: venatum/bull-board:latest
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # must match SERVER_QUEUE_REDIS_PREFIX (defaults to paperless-gdrive-link)
      BULL_PREFIX: paperless-gdrive-link
    depends_on:
      redis:
        condition: service_healthy

  paperless-redis:
    image: redis:7-alpine
    volumes:
      - paperless-redis-data:/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - paperless-redis
    ports:
      - "8010:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_URL: http://localhost:8010
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media

  sqlite-web:
    image: coleifer/sqlite-web
    command: ["sqlite_web", "/data/paperfeed.db", "--host", "0.0.0.0"]
    ports:
      - "8082:8080"
    volumes:
      - ./data:/data

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    command: ["http", "host.docker.internal:3000"]
    ports:
      - "4040:4040" # ngrok inspector UI, shows the public https URL
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-data:
  paperless-redis-data:
  paperless-data:
  paperless-media:
