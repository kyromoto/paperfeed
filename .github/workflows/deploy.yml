# .github/workflows/deploy.yml
name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [ "main", "test/pipeline" ]

jobs:
  deploy:
    runs-on: [self-hosted, paperfeed]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy
        run: |
          cd /stacks/immich.kyro.space/paperfeed
          docker compose pull
          docker compose up -d
